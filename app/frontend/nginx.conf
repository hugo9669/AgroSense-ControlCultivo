server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: los upstream se resuelven en cada peticion (nginx no falla al arrancar
  # si la API o el agente aun no estan listos)
  resolver 127.0.0.11 valid=30s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA
  location / {
    try_files $uri /index.html;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API FastAPI (mismo origen que el front: sin CORS)
  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 90s;          # el chat con Gemini puede tardar
  }

  # Entrada del ESP32 -> Agente IoT JSON (southbound). Permite que el sensor publique por el puerto 80
  # sin abrir el 7896 en el Security Group:  POST http://<IP>/iot/json?k=<apikey>&i=<device>
  location /iot/ {
    set $iota http://iot-agent:7896;
    proxy_pass $iota;
    client_max_body_size 16k;
  }
}
