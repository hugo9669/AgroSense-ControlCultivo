server {
  listen 80;
  listen 443 ssl;
  server_name 32.193.138.160 _;
  server_tokens off;

  # Certificado SSL/TLS (Opción 2: autofirmado con SAN para IP 32.193.138.160)
  ssl_certificate     /etc/nginx/ssl/agrosense.crt;
  ssl_certificate_key /etc/nginx/ssl/agrosense.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Cabeceras de seguridad
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: los upstream se resuelven en cada petición
  resolver 127.0.0.11 valid=30s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA
  location / {
    try_files $uri /index.html;
  }
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # WebSocket en tiempo real hacia FastAPI (soporta ws:// y wss://)
  location /api/ws {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # API FastAPI (mismo origen que el front: sin CORS)
  location /api/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;          # el chat con Gemini puede tardar
  }

  # Entrada del ESP32 -> Agente IoT JSON (southbound). Sigue funcionando por HTTP :80 y HTTPS :443
  # sin necesidad de reprogramar el microcontrolador: POST http://<IP>/iot/json?k=<apikey>&i=<device>
  location /iot/ {
    set $iota http://iot-agent:7896;
    proxy_pass $iota;
    client_max_body_size 16k;
  }
}
